<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="srGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="srGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#059669" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#srGrad)" filter="url(#dropShadow)" />

  <!-- Bus Shape Outline -->
  <rect x="136" y="112" width="240" height="260" rx="44" fill="#ffffff" />
  
  <!-- Bus Windshield -->
  <path d="M164 144 H348 C354 144 360 149 360 156 V208 H152 V156 C152 149 158 144 164 144 Z" fill="#0f172a" />

  <!-- Windshield Reflection -->
  <path d="M168 152 L224 152 L196 200 L160 200 Z" fill="#334155" opacity="0.6" />

  <!-- Resale Exchange Arrows Overlay (Center) -->
  <circle cx="256" cy="272" r="62" fill="#059669" />
  
  <!-- Bidirectional Arrow Relay Glyph -->
  <path d="M228 260 H284 M284 260 L270 246 M284 260 L270 274" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M284 284 H228 M228 284 L242 270 M228 284 L242 298" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Headlights -->
  <circle cx="176" cy="336" r="14" fill="#fbbf24" />
  <circle cx="336" cy="336" r="14" fill="#fbbf24" />

  <!-- Carrier Wheels -->
  <rect x="156" y="360" width="36" height="32" rx="10" fill="#0f172a" />
  <rect x="320" y="360" width="36" height="32" rx="10" fill="#0f172a" />

  <!-- Indian Rupee / Face-Value Guarantee Seal Badge -->
  <circle cx="392" cy="120" r="42" fill="#10b981" stroke="#ffffff" stroke-width="6" />
  <text x="392" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">₹</text>
</svg>
